{% set name = "fcswrite" %}
{% set version = "0.6.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fcswrite-{{ version }}.tar.gz
  sha256: 056924722c76282953d2681e46d5dc65471d3277089329cd993ab8359c979d15

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - pytest-runner
    - python >=3.6
  run:
    - numpy >=1.7.0
    - python >=3.6

test:
  imports:
    - fcswrite
  commands:
    - pip list
    - pip check
  requires:
    - pip

about:
  home: https://github.com/ZELLMECHANIK-DRESDEN/fcswrite
  summary: Write .fcs files (flow cytometry)
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - goanpeca
